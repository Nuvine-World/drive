dataset:
  type: coinfra
  root: data/coinfra
  smoke:
    enabled: false
    splits:
      train: [2025_03_27_sunny]
      val: [2025_11_18_sunny]
      test: [2025_03_24_rainy]
    sessions_per_split: 1
    slices_per_session: 1
    frames_per_slice: 1
    epochs: 2
    seeds: 1
  weather: [sunny, rainy, heavysnow, freezingrain]
  nodes: []
  frame_stride: 5
  max_frames_per_slice: null
  max_timestamp_delta_s: 0.15
  annotation_file: global_roi.yaml
  yaw_unit: radians
  classes: [car, truck, bus, bicycle, pedestrian]
  class_aliases: {person: pedestrian, cyclist: bicycle, vehicle: car}
  # CoInfra's global metric frame is centered near the roundabout origin.
  bounds: [-100.0, -100.0, -5.0, 100.0, 100.0, 20.0]
  resolution: 0.4
  # Separate prediction slots preserve closely spaced same-class objects whose
  # centers fall in the same official 0.4 m BEV cell.
  objects_per_cell: 2
  splits:
    train: [2025_03_27_sunny]
    val: [2025_11_18_sunny]
    test: [2025_11_20_sunny, 2025_02_12_heavysnow, 2025_04_07_heavysnow,
           2025_11_27_heavysnow, 2025_03_24_rainy, 2025_04_02_freezingrain]
training:
  seeds: [42, 43, 44]
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  require_cuda: true
  hidden_channels: 32
  # RTX 4090/3090 server profile. CUDA OOM recovery will split a training
  # batch automatically if an unusually large multi-node sample does not fit.
  batch_size: 8
  preprocessing_workers: 8
  mixed_precision: true
  modes: [early, intermediate, adaptive, single]
  node_counts: [1, 2, 4, 8]
  checkpointing:
    keep_best: 3
    weights: {val_loss_quality: 0.34, val_map: 0.33, val_recall: 0.33}
  recovery:
    resume: true
    save_every_epochs: 1
    wait_for_resources: true
    poll_seconds: 60
    timeout_minutes: 60
    minimum_free_disk_gb: 5
    minimum_free_gpu_gb: 2
    cuda_oom_retries: 3
    # Preserve stale per-seed artifacts and retrain only that seed during unattended runs.
    on_incompatible: quarantine
evaluation:
  receiver_policy: all
  # Validation materializes both early- and per-node BEVs, so keep this below
  # the training batch even on a 24 GB card.
  batch_size: 8
  strategies: [early, intermediate, late, adaptive]
  node_counts: [1, 2, 4, 8]
  subsets_per_count: 5
  subset_seed: 17
  score_threshold: 0.15
  nms_iou: 0.2
  iou_thresholds: [0.5, 0.7]
  max_detections: 150
adaptive_fusion:
  training_budgets: [0.01, 0.05, 0.10, 0.25]
  evaluation_budgets: [0.01, 0.05, 0.10, 0.25]
  ablations: [random, energy]
  index_bytes: 4
  value_bytes: 2
latency_experiment:
  frame_period_ms: 100.0
  profile_batch_size: 1
  # Must exceed sensing plus the largest configured RTT (140 ms).
  deadlines_ms: [150.0, 250.0]
  burst_multipliers: [1, 2, 4]
deployment_assumptions:
  source: "literature assumption; citation required"
  bandwidths_mbps: [10, 100, 1000]
  sensing_ms: 100.0
  edge_rtt_ms: 5.0
  cloud_rtt_ms: 40.0
  processing_ms:
    edge: {early: 80.0, intermediate: 45.0, late: 25.0, adaptive: 50.0}
    cloud: {early: 40.0, intermediate: 30.0, late: 20.0, adaptive: 35.0}
output:
  root: outputs/coinfra
  plots: true
